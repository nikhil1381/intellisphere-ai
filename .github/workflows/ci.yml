name: IntelliSphereAI CI

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade Pip
        run: |
          python -m pip install --upgrade pip

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Validate Python Syntax
        run: |
          python -m compileall src

      - name: Run Unit Tests
        run: |
          pytest
        
      - name: Run AI Evaluations
        run: |
            python evaluations/run_evaluations.py

      - name: Build Success
        run: |
          echo "IntelliSphereAI build completed successfully."

      - name: Run RAG Evaluations
        run: |
            python -m evaluations.run_rag_evaluations